aid: nocodb
name: NocoDB
description: >-
  NocoDB is an open-source, self-hostable alternative to Airtable that turns any
  relational database — MySQL, PostgreSQL, Microsoft SQL Server, or SQLite — into
  a collaborative smart spreadsheet. It exposes a versioned REST API (v2 and v3)
  with separate Data APIs for record CRUD operations and Meta APIs for managing
  workspaces, bases, tables, fields, views, and attachments. Authentication is
  handled via API tokens or session auth tokens, with Swagger UI bundled into
  every instance for live exploration. NocoDB is available as a free community
  self-hosted deployment or as a managed cloud service with tiered plans ranging
  from Free to Enterprise.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Database
  - No-Code
  - Low-Code
  - Airtable Alternative
  - Open Source
  - Spreadsheet
  - REST API
  - Self-Hosted
url: https://raw.githubusercontent.com/api-evangelist/nocodb/refs/heads/main/apis.yml
created: '2026-06-12'
modified: '2026-06-12'
specificationVersion: '0.19'
apis:
  - aid: nocodb:data-api
    name: NocoDB Data API
    description: >-
      RESTful API for querying and manipulating records across tables and views
      in any NocoDB base. Supports full CRUD operations on rows, filtering via
      where-clause operators, pagination, sorting, field selection, and bulk
      operations. Available in v2 and v3; v3 adds quoted-value support for
      special characters in query parameters.
    humanURL: https://nocodb.com/docs/product-docs/developer-resources/rest-apis
    baseURL: https://app.nocodb.com/api/v3
    tags:
      - Records
      - Rows
      - Tables
      - Views
      - CRUD
    properties:
      - type: Documentation
        url: https://nocodb.com/docs/product-docs/developer-resources/rest-apis
      - type: OpenAPI
        url: https://app.nocodb.com/api/v3/swagger.json
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/nocodb/refs/heads/main/openapi/nocodb-data-api-openapi.yml

  - aid: nocodb:meta-api
    name: NocoDB Meta API
    description: >-
      RESTful API for managing NocoDB metadata including workspaces, bases,
      tables, fields, views, hooks (webhooks), scripts, and user permissions.
      Collaboration-related meta operations require Business plan or higher;
      View and Script APIs require Enterprise tier or licensed self-hosted
      Business+.
    humanURL: https://nocodb.com/docs/product-docs/developer-resources/rest-apis
    baseURL: https://app.nocodb.com/api/v3/meta
    tags:
      - Metadata
      - Workspaces
      - Bases
      - Tables
      - Fields
      - Webhooks
    properties:
      - type: Documentation
        url: https://nocodb.com/docs/product-docs/developer-resources/rest-apis
      - type: OpenAPI
        url: https://app.nocodb.com/api/v2/meta/bases/{base_id}/swagger.json
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/nocodb/refs/heads/main/openapi/nocodb-meta-api-openapi.yml

